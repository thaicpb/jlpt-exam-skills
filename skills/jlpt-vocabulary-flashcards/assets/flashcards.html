<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcard từ vựng JLPT</title>
<style>
:root{color-scheme:light dark;--bg:#f4f3ef;--paper:#fffefa;--ink:#213c3b;--muted:#60716e;--line:#dbe2dc;--accent:#17695f;--soft:#eaf3ed;--bg:light-dark(#f4f3ef,#141b22);--paper:light-dark(#fffefa,#1d2731);--ink:light-dark(#213c3b,#ecf3f0);--muted:light-dark(#60716e,#b0c2bd);--line:light-dark(#dbe2dc,#3e504f);--accent:light-dark(#17695f,#92d9c5);--soft:light-dark(#eaf3ed,#253c38)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:clamp(15px,2vw,17px)/1.55 system-ui,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.4;cursor:default}
#jlpt-flashcards{width:100%;max-width:880px;margin:auto;padding:clamp(16px,4vw,36px) clamp(12px,3vw,24px)}.fc-top{display:flex;justify-content:space-between;align-items:center;gap:16px}.fc-eyebrow,.fc-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--muted)}h1{font-size:clamp(21px,4vw,26px);line-height:1.25;margin:3px 0 0;font-weight:650}#fc-meta{font-size:13px;color:var(--muted);margin:0;white-space:nowrap}progress{width:100%;height:5px;accent-color:var(--accent);display:block;margin:clamp(12px,2.5vw,20px) 0}.fc-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}.fc-toolbar .fc-actions{margin:0}.fc-actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}button{border:1px solid var(--line);border-radius:11px;background:var(--paper);color:var(--ink);min-height:44px;padding:8px 14px}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--accent)}.fc-card{background:var(--paper);border:1px solid var(--line);border-radius:clamp(16px,3vw,24px);overflow:hidden;box-shadow:0 12px 40px #102e2710}.fc-vocab{padding:clamp(18px,4vw,28px) clamp(16px,4vw,32px);text-align:center;border-bottom:1px solid var(--line)}.fc-word{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;font-size:clamp(34px,8vw,56px);font-weight:650;line-height:1.3;letter-spacing:.05em;margin:4px 0}.fc-front{min-height:clamp(150px,30vh,220px);display:flex;flex-direction:column;justify-content:center}.fc-hint{color:var(--muted);font-size:14px;margin:6px 0}.fc-info{display:grid;grid-template-columns:1fr 1.3fr;padding:clamp(14px,3vw,22px) clamp(16px,4vw,32px);gap:clamp(14px,3vw,24px)}.fc-info>div+div{border-left:1px solid var(--line);padding-left:clamp(14px,3vw,24px)}.fc-reading{font-size:clamp(17px,3vw,20px);margin-top:4px}.fc-meaning{font-size:clamp(17px,3vw,20px);margin-top:4px;font-weight:550}.fc-example{margin:0 clamp(10px,3vw,24px) clamp(12px,3vw,24px);background:var(--soft);padding:clamp(14px,3vw,22px) clamp(14px,3vw,24px);border-radius:14px}.fc-japanese{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;font-size:clamp(18px,3.5vw,22px);line-height:2;margin:8px 0 6px;overflow-wrap:anywhere;line-break:strict}.fc-japanese ruby{ruby-position:over}.fc-japanese rt{font-size:11px;font-weight:400;color:var(--muted)}.fc-target{color:var(--accent);font-weight:750;border-bottom:2px solid var(--accent);padding-bottom:2px}.fc-translation{margin:6px 0 0;border-top:1px solid var(--line);padding-top:12px;font-size:15px;line-height:1.55}.fc-source{font-size:11px;color:var(--muted);margin:0 clamp(18px,4vw,32px) clamp(14px,3vw,22px);overflow-wrap:anywhere}.fc-source summary{cursor:pointer}.fc-source p{margin:6px 0}.fc-primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:650}.fc-nav{display:flex;gap:8px;margin-left:auto}#fc-status{font-size:11px;color:var(--muted);text-align:center;margin:6px 0}.fc-empty{padding:24px}.fc-missing{font-size:13px;color:var(--muted)}
#fc-static{display:grid;gap:12px;margin-top:22px}.fc-static-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}.fc-static-card summary{display:flex;align-items:center;gap:14px;cursor:pointer;min-height:64px;padding:12px 18px}.fc-static-number{color:var(--muted);min-width:2ch}.fc-static-word{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;font-size:24px;font-weight:650}.fc-static-answer{border-top:1px solid var(--line);padding-top:20px}.fc-static-answer .fc-source{margin-top:0}.fc-compat-note{color:var(--muted);font-size:14px;margin:8px 0 0}
@media(max-width:560px){#jlpt-flashcards{padding:14px 10px}.fc-top{align-items:flex-end;gap:8px}.fc-eyebrow{font-size:10px;letter-spacing:.08em}#fc-meta{text-align:right}.fc-toolbar{align-items:stretch}.fc-toolbar .fc-actions{flex:1}.fc-toolbar button{min-height:40px;padding:7px 10px;font-size:13px}.fc-vocab{padding:16px 14px}.fc-front{min-height:140px}.fc-info{padding:14px;gap:12px;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}.fc-info>div+div{padding-left:12px}.fc-example{margin:0 8px 10px;padding:12px}.fc-japanese{line-height:1.85}.fc-nav{width:100%;margin:0}.fc-nav button{flex:1}#fc-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}#fc-actions>button{width:100%}#fc-actions .fc-nav{grid-column:1/-1}.fc-source{margin:0 14px 12px}#fc-audio-status{margin:5px 0}}
@media(max-width:360px){.fc-top{align-items:flex-start;flex-direction:column;gap:4px}#fc-meta{text-align:left}.fc-toolbar{display:grid;grid-template-columns:1fr}.fc-toolbar .fc-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.fc-toolbar #fc-display-mode{grid-template-columns:1fr}.fc-word{font-size:32px}.fc-info{grid-template-columns:1fr;gap:10px}.fc-info>div+div{border-left:0;border-top:1px solid var(--line);padding:10px 0 0}}
@media(max-height:720px) and (max-width:760px){#jlpt-flashcards{padding-top:10px;padding-bottom:10px}.fc-eyebrow{display:none}progress{margin:9px 0}.fc-toolbar{margin-bottom:6px}.fc-actions{margin:7px 0}.fc-front{min-height:120px}.fc-vocab{padding-top:12px;padding-bottom:12px}.fc-hint{margin:2px 0}.fc-example{padding-top:10px;padding-bottom:10px}.fc-japanese{margin-top:5px;margin-bottom:3px}}
#fc-static[hidden]{display:none}
.fc-card{transform-origin:center center;backface-visibility:hidden;}
.fc-card.fc-turning{will-change:transform;height:auto;pointer-events:none;}
@media(prefers-reduced-motion:reduce){.fc-card{transform:none!important;}}
</style>
<main id="jlpt-flashcards">
<header class="fc-top"><div><div class="fc-eyebrow">日本語 · Thẻ từ vựng</div><h1 id="fc-title">__TITLE__</h1></div><p id="fc-meta">__STATIC_META__</p></header>
<section id="fc-static" aria-label="Danh sách flashcard tương thích">
<p class="fc-compat-note">Chạm vào từng từ để xem cách đọc, ý nghĩa và câu mẫu.</p>
__STATIC_CARDS__
</section>
<section id="fc-interactive" hidden aria-label="Flashcard tương tác">
<progress id="fc-progress" aria-label="Vị trí thẻ"></progress>
<div class="fc-toolbar">
<div id="fc-filters" class="fc-actions"></div>
<div id="fc-display-mode" class="fc-actions" aria-label="Chế độ hiển thị nghĩa"></div>
</div>
<div id="fc-actions" class="fc-actions"></div>
<article id="fc-card" class="fc-card" aria-live="polite"></article>
<p id="fc-audio-status" class="fc-compat-note" role="status"></p>
<p id="fc-status" role="status"></p>
</section>
<script type="application/json" id="fc-data">__DATA__</script>
<script>
(()=>{
const root=document.getElementById('jlpt-flashcards');
const get=id=>root.querySelector('#'+id);
const payload=JSON.parse(get('fc-data').textContent);
const items=payload.items,marked=new Set();
let index=0,flipped=false,showMeaningByDefault=false,reviewOnly=false,turning=false;
const key=item=>item.source_file+':'+item.source_line;
const el=(tag,value,cls)=>{const n=document.createElement(tag);if(value!==undefined)n.textContent=value;if(cls)n.className=cls;return n};
const button=(label,fn)=>{const b=el('button',label);b.type='button';b.onclick=()=>{if(!turning)fn()};return b};
const label=text=>el('div',text,'fc-label');
const synth=window.speechSynthesis;
const canSpeak=Boolean(synth&&window.SpeechSynthesisUtterance);
let utterance=null;
function stopSpeech(){
 const previous=utterance;utterance=null;
 if(previous)synth.cancel();
 get('fc-audio-status').textContent='';
}
function speak(item){
 stopSpeech();
 if(!canSpeak){get('fc-audio-status').textContent='Trình duyệt này chưa hỗ trợ phát âm.';return}
 const voices=synth.getVoices().filter(voice=>/^ja(?:[-_]|$)/i.test(voice.lang));
 if(!voices.length){
  get('fc-audio-status').textContent='Chưa có giọng tiếng Nhật. Hãy bật hoặc cài giọng Nhật trên thiết bị rồi thử lại.';
  return;
 }
 const current=new SpeechSynthesisUtterance(item.reading);
 current.lang='ja-JP';current.voice=voices.find(voice=>voice.localService)||voices[0];
 current.rate=0.85;utterance=current;
 current.onend=()=>{if(utterance===current){utterance=null;get('fc-audio-status').textContent=''}};
 current.onerror=()=>{if(utterance===current){utterance=null;get('fc-audio-status').textContent='Không phát được âm thanh. Hãy thử lại hoặc mở bằng trình duyệt khác.'}};
 get('fc-audio-status').textContent='Đang phát âm…';
 try{synth.speak(current)}catch(error){current.onerror()}
}
// Prime asynchronous voice loading; each click reads the latest voice list.
if(canSpeak)synth.getVoices();
window.addEventListener('pagehide',stopSpeech);
function appendPlain(parent,text,word){
 const parts=text.split(word);
 parts.forEach((part,i)=>{if(i)parent.append(el('span',word,'fc-target'));parent.append(document.createTextNode(part))});
}
function example(item){
 const section=el('section',undefined,'fc-example');section.append(label('Câu mẫu'));
 const sentence=el('p',undefined,'fc-japanese');sentence.lang='ja';
 for(const segment of item.example_segments||[{text:item.example}]){
  if(segment.target===true)sentence.append(el('span',segment.text,'fc-target'));
  else if(segment.reading){const ruby=el('ruby');ruby.append(document.createTextNode(segment.text),el('rp','('),el('rt',segment.reading),el('rp',')'));sentence.append(ruby)}
  else appendPlain(sentence,segment.text,item.word);
 }
 section.append(sentence,el('p',item.example_vi||'Chưa có bản dịch câu mẫu.',item.example_vi?'fc-translation':'fc-missing'));
 return section;
}
async function flipCard(){
 if(turning)return;
 const card=get('fc-card');
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||!card.animate){
  flipped=!flipped;render();get('fc-actions').querySelector('button').focus({preventScroll:true});return;
 }
 turning=true;
 const direction=flipped?-1:1;
 const oldHeight=card.offsetHeight;
 card.classList.add('fc-turning');
 get('fc-actions').setAttribute('aria-busy','true');
 let outgoing,incoming;
 try{
  outgoing=card.animate([
   {transform:'perspective(1400px) rotateY(0deg)',filter:'brightness(1)'},
   {transform:`perspective(1400px) rotateY(${direction*90}deg)`,filter:'brightness(.82)'}
  ],{duration:230,easing:'cubic-bezier(.55,0,1,.45)',fill:'forwards'});
  await outgoing.finished;
  flipped=!flipped;render();
  const newHeight=card.offsetHeight;
  // Reveal the other face only after the card reaches its edge.
  outgoing.cancel();
  incoming=card.animate([
   {transform:`perspective(1400px) rotateY(${-direction*90}deg)`,height:oldHeight+'px',filter:'brightness(.82)'},
   {transform:'perspective(1400px) rotateY(0deg)',height:newHeight+'px',filter:'brightness(1)'}
  ],{duration:310,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'});
  await incoming.finished;
 }finally{
  outgoing?.cancel();incoming?.cancel();
  card.classList.remove('fc-turning');turning=false;
  get('fc-actions').removeAttribute('aria-busy');
  get('fc-actions').querySelector('button')?.focus({preventScroll:true});
 }
}
function render(){
 stopSpeech();
 const list=reviewOnly?items.filter(item=>marked.has(key(item))):items;
 index=Math.max(0,Math.min(index,list.length-1));
 const lessons=[...new Set(items.map(item=>item.source_file.match(/dai(\d+)\.csv$/)?.[1]).filter(Boolean))];
 get('fc-title').textContent=payload.level+(lessons.length===1?' · Bài '+lessons[0]:' · Từ vựng');
 get('fc-meta').textContent=list.length?'Thẻ '+(index+1)+' / '+list.length:'Chưa có thẻ được đánh dấu';
 get('fc-progress').max=list.length||1;get('fc-progress').value=list.length?index+1:0;
 get('fc-status').textContent='Dấu “Cần xem lại” chỉ lưu trong phiên này.';
 const filters=get('fc-filters');filters.replaceChildren();
 for(const [text,value] of [['Tất cả · '+items.length,false],['Cần xem lại · '+marked.size,true]]){
  const b=button(text,()=>{reviewOnly=value;index=0;flipped=showMeaningByDefault;render()});b.setAttribute('aria-pressed',String(reviewOnly===value));filters.append(b);
 }
 const displayMode=get('fc-display-mode');displayMode.replaceChildren();
 const meaningMode=button('Luôn hiện nghĩa: '+(showMeaningByDefault?'Bật':'Tắt'),()=>{
  showMeaningByDefault=!showMeaningByDefault;flipped=showMeaningByDefault;render();
  get('fc-display-mode').querySelector('button').focus({preventScroll:true});
 });
 meaningMode.setAttribute('aria-pressed',String(showMeaningByDefault));displayMode.append(meaningMode);
 const card=get('fc-card'),actions=get('fc-actions');card.replaceChildren();actions.replaceChildren();
 if(!list.length){card.append(el('p','Chưa có thẻ cần xem lại. Chọn “Tất cả” để tiếp tục.','fc-empty'));return}
 const item=list[index];
 const vocab=el('div',undefined,'fc-vocab'+(flipped?'':' fc-front'));
 vocab.append(label('Từ đang học'));const word=el('div',item.word,'fc-word');word.lang='ja';vocab.append(word);card.append(vocab);
 const audio=button('🔊 Phát âm',()=>speak(item));
 audio.setAttribute('aria-label','Phát âm từ '+item.word);
 const audioControls=el('div');audioControls.append(audio);vocab.append(audioControls);
 if(flipped){
  const info=el('div',undefined,'fc-info');
  const reading=el('div');const readingText=el('div',item.reading,'fc-reading');readingText.lang='ja';reading.append(label('Cách đọc'),readingText);
  const meaning=el('div');meaning.append(label('Ý nghĩa'),el('div',item.meaning_vi,'fc-meaning'));info.append(reading,meaning);
  const source=el('details',undefined,'fc-source');source.append(el('summary','Nguồn dữ liệu'),el('p',key(item)));
  if(item.example_notes_source)source.append(el('p','Bản dịch và furigana bổ sung: '+item.example_notes_source));
  card.append(info,example(item),source);
 }else vocab.append(el('p','Nhớ cách đọc và ý nghĩa trước khi lật thẻ.','fc-hint'));
 const flip=button(flipped?'↶ Mặt trước':'Lật thẻ',flipCard);flip.className='fc-primary';actions.append(flip);
 const mark=button(marked.has(key(item))?'✓ Đã đánh dấu':'☆ Cần xem lại',()=>{const id=key(item);if(marked.has(id))marked.delete(id);else marked.add(id);if(reviewOnly)flipped=showMeaningByDefault;render()});
 mark.setAttribute('aria-pressed',String(marked.has(key(item))));actions.append(mark);
 const nav=el('div',undefined,'fc-nav');
 const prev=button('← Trước',()=>{index--;flipped=showMeaningByDefault;render()});prev.disabled=index===0;
 const next=button(index===list.length-1?'Về đầu ↺':'Tiếp →',()=>{index=(index+1)%list.length;flipped=showMeaningByDefault;render()});nav.append(prev,next);actions.append(nav);
}
render();
get('fc-interactive').hidden=false;
get('fc-static').hidden=true;
})();
</script>
</main>
</html>

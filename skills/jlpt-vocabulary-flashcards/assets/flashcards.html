<!doctype html>
<html lang="vi" data-level="__LEVEL__">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · Sổ tay từ vựng</title>
<style>
:root{color-scheme:light;--bg:#eee4d4;--paper:#fffbf3;--ink:#3f352c;--muted:#806c58;--line:#dfcdb5;--accent:#8b482e;--soft:#f4e8d6;--highlight:#f0dfbc;--shadow:#dfcfb84d}
:root[data-level="N1"]{--bg:#f4e9e5;--paper:#fffaf6;--ink:#422b2b;--muted:#815e5b;--line:#e4c9c5;--accent:#b32230;--soft:#f7dfdc;--highlight:#f6d8d1;--shadow:#c9959540}
:root[data-level="N2"]{--bg:#e8edf4;--paper:#fcfcff;--ink:#1c2e4b;--muted:#5e6e87;--line:#cbd5e3;--accent:#12285d;--soft:#dfe8f5;--highlight:#d8e8f8;--shadow:#9caec740}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,summary{font:inherit}button,summary{cursor:pointer}button{color:inherit;touch-action:manipulation}button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button:disabled{opacity:.38;cursor:default}[hidden]{display:none!important}
main{max-width:680px;margin:0 auto;padding:35px 24px 26px}.masthead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:26px}.brand{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}.level-badge{font-size:11px;border:1px solid var(--line);border-radius:30px;padding:3px 10px;color:var(--accent);font-weight:650}h1{font-size:25px;letter-spacing:-.035em;font-weight:500;margin:5px 0 0}.subtitle{font-size:12px;color:var(--muted);margin:4px 0 0}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line)}.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 2px;color:var(--muted)}.tab[aria-pressed=true]{color:var(--accent);border-bottom-color:var(--accent)}.count{font-size:11px;margin-left:5px;background:var(--soft);border-radius:20px;padding:2px 6px}.settings{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:17px 0 12px}.settings label{display:flex;align-items:center;gap:7px;cursor:pointer}.settings input{accent-color:var(--accent);width:15px;height:15px}.controls{display:flex;justify-content:space-between;gap:8px;margin-bottom:16px}.nav{display:flex;gap:7px}.control{min-height:42px;border:1px solid var(--line);background:transparent;border-radius:6px;padding:8px 13px;font-size:13px}.control:hover:not(:disabled){background:var(--soft)}.control[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fffaf2}.sheet{border:1px solid var(--line);border-radius:9px;background:var(--paper);box-shadow:5px 6px 0 var(--shadow);padding:27px 34px 24px;min-height:480px}.sheet-top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:26px;font-size:11px;letter-spacing:.1em;color:var(--muted)}.sheet-top span:last-child{font-size:12px;letter-spacing:.04em}.word-block{border-left:3px solid var(--accent);padding:1px 0 4px 21px;margin-bottom:25px}.word-line{display:flex;align-items:center;justify-content:space-between;gap:12px}h2{font:500 clamp(39px,8vw,52px)/1.45 'Yu Mincho','Hiragino Mincho ProN','Noto Serif CJK JP',serif;letter-spacing:.07em;margin:0 0 7px}.sound{display:grid;place-items:center;flex-shrink:0;background:none;border:1px solid var(--line);border-radius:50%;width:40px;height:40px;color:var(--accent)}.sound:hover{background:var(--soft)}.reading{min-height:35px;display:flex;align-items:center;gap:12px}.reading span{font-size:18px;letter-spacing:.03em}.text-button{background:none;border:0;border-bottom:1px solid currentColor;color:var(--accent);padding:2px 0;font-size:13px}.hint{font-size:12px;color:var(--muted);margin:7px 0 0}.answer{border-top:1px solid var(--line);padding-top:21px}.label{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}.meaning{font:19px/1.65 Georgia,'Times New Roman',serif;margin:0 0 23px}.example{border-left:2px solid var(--line);padding:0 0 0 20px;margin-bottom:23px}.japanese{font:20px/2.05 'Yu Mincho','Hiragino Mincho ProN',serif;margin:0 0 10px;overflow-wrap:anywhere}.japanese rt{font:10px sans-serif;color:var(--muted)}mark{background:var(--highlight);color:inherit;padding:0 2px}.translation summary{font-size:13px;color:var(--accent);min-height:32px;padding:4px 0}.translation p{font-size:14px;line-height:1.7;margin:7px 0 0;color:var(--muted)}.recall{padding:17px 0 28px;text-align:center;border-top:1px solid var(--line);color:var(--muted)}.recall p:first-child{font:21px/1.5 Georgia,serif;color:var(--ink);margin:18px 0 8px}.recall p:last-child{font-size:13px;margin:0}.primary{display:block;width:100%;min-height:44px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff9f0;font-size:14px;padding:10px 14px}.primary:hover{filter:brightness(.9)}.source{font-size:11px;color:var(--muted);margin-top:17px;overflow-wrap:anywhere}.source summary{min-height:28px}.source p{margin:4px 0}.footer{text-align:center;color:var(--muted);font-size:12px;margin:20px 0 0}.footer p{margin:5px 0}#status{font-size:12px;color:var(--accent);margin:8px 0;min-height:0}#status:empty{display:none}.empty{padding:50px 10px;text-align:center}.fallback details{margin:20px 0;border:1px solid var(--line);padding:20px;background:var(--paper)}.fallback summary{font-size:28px}
@media(max-width:480px){main{padding:22px 16px}.masthead{margin-bottom:17px}.sheet{padding:22px 21px 18px;min-height:0}.sheet-top{margin-bottom:23px}.word-block{padding-left:16px;margin-bottom:20px}.example{padding-left:15px}.controls .control{padding:8px 10px;font-size:12px}.tabs{gap:18px}.meaning{font-size:18px}.settings{font-size:11px}.japanese{font-size:19px}.brand{font-size:10px}.level-badge{font-size:10px}.word-line{gap:5px}}
@media(prefers-reduced-motion:no-preference){.sheet{animation:appear .22s ease-out}@keyframes appear{from{opacity:.7;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}}
.fc-static-card{border-radius:9px}.fc-static-answer{padding-top:16px}.fc-info{display:grid;gap:14px}.fc-label{font-size:11px;letter-spacing:.1em;color:var(--muted)}.fc-reading,.fc-meaning{font-size:18px}.fc-example{border-left:2px solid var(--line);padding-left:16px;margin-top:20px}.fc-japanese{font:20px/2 'Yu Mincho','Hiragino Mincho ProN',serif}.fc-japanese rt{font:11px sans-serif;color:var(--muted)}.fc-target{background:var(--highlight)}.fc-source{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.fc-static-number{font-size:13px;margin-right:15px;color:var(--muted)}
</style>
</head><body><main>
<header class="masthead"><div><div class="brand">日本語 · Mỗi ngày một chút</div><h1>Sổ tay từ vựng</h1><p class="subtitle">__TITLE__</p></div><span class="level-badge">JLPT __LEVEL__</span></header>
<section id="fc-static" class="fallback" aria-label="Danh sách flashcard tương thích">
<p class="subtitle">__STATIC_META__</p>
__STATIC_CARDS__
</section>
<section id="fc-interactive" hidden>
<nav class="tabs" aria-label="Nhóm từ"><button class="tab" id="all" aria-pressed="true">Học từ <span class="count">__COUNT__</span></button><button class="tab" id="review" aria-pressed="false">Cần xem lại <span class="count" id="review-count">0</span></button></nav>
<div class="settings"><span id="position" aria-live="polite"></span><label><input type="checkbox" id="always" checked>Luôn hiện nghĩa</label></div>
<div class="controls"><button id="bookmark" class="control" aria-pressed="false">☆ Cần xem lại</button><div class="nav"><button id="prev" class="control">← Trước</button><button id="next" class="control">Tiếp →</button></div></div>
<article class="sheet" id="sheet" aria-label="Thẻ từ vựng"></article><p id="status" role="status"></p>
<footer class="footer"><p>Đọc nghĩa · Hiểu câu · Tự nhớ lại</p><p>Dấu xem lại được giữ trong phiên học này.</p></footer>
</section>

<script type="application/json" id="fc-data">__DATA__</script>
<script>
(()=>{
const words=JSON.parse(document.getElementById('fc-data').textContent).items;
const get=id=>document.getElementById(id);const $=get,marked=new Set();let index=0,review=false,visible=true,reading=false;
const key=w=>w.source_file+':'+w.source_line;
const list=()=>review?words.filter(w=>marked.has(key(w))):words;
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const btn=(text,handler,cls)=>{const b=el('button',text,cls);b.type='button';b.onclick=handler;return b};
function example(w){const p=el('p',undefined,'japanese');p.lang='ja';for(const s of w.example_segments||[{text:w.example}]){if(s.target){p.append(el('mark',s.text));}else if(s.reading){const r=el('ruby',s.text);r.append(el('rt',s.reading));p.append(r)}else{s.text.split(w.word).forEach((part,i)=>{if(i)p.append(el('mark',w.word));p.append(document.createTextNode(part))})}}return p}
function reset(){visible=$('always').checked;reading=false;$('status').textContent='';window.speechSynthesis?.cancel()}
function render(){const items=list();index=Math.max(0,Math.min(index,items.length-1));$('review-count').textContent=marked.size;$('all').setAttribute('aria-pressed',!review);$('review').setAttribute('aria-pressed',review);$('position').textContent=items.length?`Thẻ ${String(index+1).padStart(2,'0')} / ${String(items.length).padStart(2,'0')}`:'Chưa có từ cần xem lại';$('prev').disabled=index===0||!items.length;$('next').disabled=!items.length;$('next').textContent=index===items.length-1?'Về đầu ↺':'Tiếp →';$('bookmark').disabled=!items.length;const sheet=$('sheet');sheet.replaceChildren();if(!items.length){$('bookmark').textContent='☆ Cần xem lại';$('bookmark').setAttribute('aria-pressed','false');sheet.append(el('p','Bạn chưa đánh dấu từ nào.','empty'));return}const w=items[index];$('bookmark').setAttribute('aria-pressed',marked.has(key(w)));$('bookmark').textContent=marked.has(key(w))?'★ Đã đánh dấu':'☆ Cần xem lại';
const top=el('div',undefined,'sheet-top');top.append(el('span','SỔ TAY TỪ VỰNG'),el('span','日本語'));sheet.append(top);
const block=el('div',undefined,'word-block'),line=el('div',undefined,'word-line'),word=el('h2',w.word);word.lang='ja';line.append(word);
const audio=btn('',()=>{const synth=window.speechSynthesis;const voice=synth?.getVoices().find(v=>/^ja(?:[-_]|$)/i.test(v.lang));if(!voice||!window.SpeechSynthesisUtterance){$('status').textContent='Chưa có giọng tiếng Nhật trên thiết bị này.';return}synth.cancel();const utterance=new SpeechSynthesisUtterance(w.reading);utterance.lang='ja-JP';utterance.voice=voice;utterance.rate=.85;utterance.onerror=()=>{$('status').textContent='Không phát được âm thanh. Hãy thử lại.'};synth.speak(utterance)},'sound');audio.setAttribute('aria-label','Phát âm từ '+w.word);audio.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></svg>';line.append(audio);block.append(line);
const row=el('div',undefined,'reading');if(reading){const r=el('span',w.reading);r.lang='ja';row.append(r)}const rb=btn(reading?'Ẩn':'Hiện cách đọc',()=>{reading=!reading;render();$('reading-toggle').focus()},'text-button');rb.id='reading-toggle';rb.setAttribute('aria-expanded',reading);row.append(rb);block.append(row);sheet.append(block);
if(visible){const answer=el('section',undefined,'answer');answer.append(el('p','NGHĨA','label'),el('p',w.meaning_vi,'meaning'));const ex=el('section',undefined,'example');ex.append(el('p','VÍ DỤ','label'),example(w));const tr=el('details',undefined,'translation');tr.append(el('summary','Xem bản dịch'),el('p',w.example_vi||'Chưa có bản dịch câu mẫu.'));ex.append(tr);answer.append(ex);sheet.append(answer)}else{const recall=el('div',undefined,'recall');recall.append(el('p','Từ này có nghĩa là gì?'),el('p','Thử nhớ trước khi mở nghĩa và câu ví dụ.'));sheet.append(recall)}
const reveal=btn(visible?'Ẩn nghĩa · Tự nhớ lại':'Hiện nghĩa và ví dụ',()=>{visible=!visible;render();$('reveal').focus()},'primary');reveal.id='reveal';reveal.setAttribute('aria-expanded',visible);sheet.append(reveal);
const src=el('details',undefined,'source');src.append(el('summary','Nguồn dữ liệu'),el('p',`${w.source_file}:${w.source_line}`),el('p',w.example_notes_source?`Bản dịch và furigana: ${w.example_notes_source}`:''));sheet.append(src);
}
$('prev').onclick=()=>{index--;reset();render()};$('next').onclick=()=>{index=(index+1)%list().length;reset();render()};$('bookmark').onclick=()=>{window.speechSynthesis?.cancel();const w=list()[index];if(marked.has(key(w)))marked.delete(key(w));else marked.add(key(w));render()};$('all').onclick=()=>{review=false;index=0;reset();render()};$('review').onclick=()=>{review=true;index=0;reset();render()};$('always').onchange=()=>{reset();render()};window.addEventListener('pagehide',()=>window.speechSynthesis?.cancel());window.speechSynthesis?.getVoices();render();get('fc-interactive').hidden=false;get('fc-static').hidden=true;
})();
</script></main></body></html>

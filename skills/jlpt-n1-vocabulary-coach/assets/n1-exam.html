<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện từ vựng N1</title>
<div id="n1-exam">
<style>
#n1-exam {box-sizing:border-box;width:100%;max-width:960px;margin:auto;padding:clamp(10px,3vw,24px);font:clamp(15px,2vw,17px)/1.5 system-ui,sans-serif;color:light-dark(#202b37,#edf2f7);--surface:light-dark(#f4f7fb,#202b38);--line:light-dark(#c9d4e3,#53657b);--brand:light-dark(#244cb3,#b9ceff);--paper:light-dark(#fff,#141d29)}
#n1-exam *{box-sizing:border-box}
#n1-exam header{margin-bottom:14px}
#n1-exam h2{font-size:clamp(22px,4vw,28px);line-height:1.25;margin:0 0 4px}
#n1-exam h3{margin:0 0 6px}
#n1-exam p{margin:6px 0}
#n1-exam button{font:inherit;white-space:normal;overflow-wrap:anywhere;cursor:pointer;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:inherit;min-height:44px;touch-action:manipulation}
#n1-exam button:hover:not(:disabled){border-color:var(--brand)}
#n1-exam button:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
#n1-exam button[aria-pressed=true]{border:2px solid var(--brand);background:var(--surface)}
#n1-exam button:disabled{cursor:default}
#n1-exam .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
#n1-exam #exam-nav{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-inline:contain;padding:2px 1px 6px;scrollbar-width:thin}
#n1-exam #exam-nav button{flex:0 0 auto;min-width:42px;padding:6px 9px}
#n1-exam article{background:var(--surface);border-radius:clamp(14px,3vw,20px);padding:clamp(16px,3vw,26px)}
#n1-exam .sentence{font-size:clamp(20px,4vw,28px);line-height:1.65;overflow-wrap:anywhere;margin:clamp(12px,2vw,20px) 0}
#n1-exam .sentence u{text-decoration-color:var(--brand);text-underline-offset:8px;text-decoration-thickness:3px}
#n1-exam .options{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
#n1-exam .options.long{grid-template-columns:1fr}
#n1-exam .options button{text-align:left;font-size:clamp(16px,3vw,20px)}
#n1-exam .details{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
#n1-exam .source{font-size:12px;overflow-wrap:anywhere}
#n1-exam .review-row{margin:12px 0;padding:14px;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;overflow-wrap:anywhere}
#n1-exam .review-row.correct{border-left-color:#15803d;background:#f0fdf4;background:light-dark(#f0fdf4,#153126)}
#n1-exam .review-row.incorrect{border-left-color:#dc2626;background:#fff1f2;background:light-dark(#fff1f2,#3a2027)}
#n1-exam .review-row.unanswered{background:var(--paper)}
#n1-exam .result-label{font-weight:700}
#n1-exam .correct .result-label{color:#166534;color:light-dark(#166534,#86efac)}
#n1-exam .incorrect .result-label{color:#b91c1c;color:light-dark(#b91c1c,#fda4af)}
#n1-exam .review-row button{margin-top:6px}
#n1-exam progress{width:100%;height:6px;accent-color:var(--brand);display:block}
#n1-exam #exam-actions button:last-child{margin-left:auto}
#n1-exam #exam-status{font-size:13px;min-height:1.5em}
@media(max-width:560px){#n1-exam{padding:10px 8px}#n1-exam header{margin-bottom:8px}#n1-exam header>p:last-child{font-size:12px;color:light-dark(#5c6874,#bbc7d3)}#n1-exam .toolbar{margin:8px 0}#n1-exam article{padding:14px 12px}#n1-exam .sentence{font-size:clamp(19px,5vw,23px);line-height:1.55;margin:10px 0}#n1-exam .options button{font-size:15px;min-height:42px;padding:8px 10px}#n1-exam #exam-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}#n1-exam #exam-actions button{width:100%}#n1-exam #exam-actions button:last-child{grid-column:1/-1;margin-left:0}}
@media(max-width:360px){#n1-exam .options{grid-template-columns:1fr}#n1-exam .options button{min-height:40px}}
@media(max-height:720px) and (max-width:760px){#n1-exam{padding-top:6px;padding-bottom:6px}#n1-exam header>p:last-child{display:none}#n1-exam header{margin-bottom:5px}#n1-exam .toolbar{margin:6px 0}#n1-exam article{padding-top:11px;padding-bottom:11px}#n1-exam .sentence{margin:7px 0;line-height:1.45}#n1-exam .options{gap:6px}#n1-exam .options button{min-height:38px;padding-top:6px;padding-bottom:6px}}
</style>
<header><h2>Luyện từ vựng N1</h2><p id="exam-meta"></p><p>Bài tập biên soạn · Từ mục tiêu từ CSV · Không phải đề chính thức</p></header>
<div id="exam-nav" class="toolbar" aria-label="Chọn câu hỏi"></div>
<progress id="exam-progress" max="1" value="0" aria-label="Số câu đã trả lời"></progress>
<article id="exam-stage"></article>
<div id="exam-actions" class="toolbar"></div>
<div id="exam-status" role="status" aria-live="polite"></div>
<script type="application/json" id="exam-data">__EXAM_DATA__</script>
<script>
(()=>{
const root=document.getElementById('n1-exam'),find=id=>root.querySelector('#'+id);
const data=JSON.parse(find('exam-data').textContent),questions=data.questions;
const answers=new Map();let index=0,submitted=false;
const instructions={reading:'Chọn cách đọc của phần gạch dưới.',context:'Chọn từ phù hợp nhất với ngữ cảnh.',paraphrase:'Chọn cách diễn đạt tiếng Nhật gần nghĩa nhất.',usage:'Chọn câu dùng từ mục tiêu đúng.'};
const node=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e};
function action(label,fn){const b=node('button',label);b.type='button';b.onclick=fn;return b}
function showPrompt(value){const e=node('div','','sentence');const match=value.match(/^(.*?)【(.*?)】(.*)$/s);if(match)e.append(document.createTextNode(match[1]),node('u',match[2]),document.createTextNode(match[3]));else e.textContent=value;return e}
function explain(q,chosen){const box=node('section','','details');box.append(node('h3',chosen===q.answer?'Đúng!':chosen===undefined?'Chưa trả lời':'Cần ôn lại'),node('p',`${q.word} · ${q.source.reading} · ${q.source.meaning_vi}`));q.options.forEach((o,i)=>box.append(node('p',`${i+1}. ${o}${i===q.answer?' — Đáp án đúng':''}: ${q.explanations[i]}`)));box.append(node('p',`Câu mẫu gốc: ${q.source.example}`),node('p',`${q.source_file}:${q.source_line}`,'source'));return box}
function render(){
const q=questions[index],chosen=answers.get(q.id),stage=find('exam-stage');stage.replaceChildren();find('exam-actions').replaceChildren();
find('exam-meta').textContent=`${data.mode==='exam'?'Kiểm tra':'Luyện tập'} · ${questions.length} câu · ${answers.size} đã trả lời`;
find('exam-progress').max=questions.length;find('exam-progress').value=answers.size;
stage.append(node('h3',`${index+1}/${questions.length} · ${data.types[q.type]}`),node('p',instructions[q.type]),showPrompt(q.prompt));
const opts=node('div','','options'+(q.type==='usage'?' long':''));q.options.forEach((o,i)=>{const b=action(`${i+1}. ${o}`,()=>{answers.set(q.id,i);render();find('exam-status').textContent=data.mode==='practice'?(i===q.answer?'Đã chọn đáp án đúng.':'Đã ghi nhận. Xem giải thích bên dưới.'):'Đã lưu lựa chọn.'});b.setAttribute('aria-pressed',String(chosen===i));b.disabled=submitted||(data.mode==='practice'&&chosen!==undefined);opts.append(b)});stage.append(opts);
if(submitted||(data.mode==='practice'&&chosen!==undefined))stage.append(explain(q,chosen));
const prev=action('← Câu trước',()=>{index--;render()});prev.disabled=index===0;
const next=action('Câu tiếp →',()=>{index++;render()});next.disabled=index===questions.length-1;
find('exam-actions').append(prev,next,action(submitted?'Xem tổng kết':'Nộp bài / Tổng kết',()=>{if(!submitted&&data.mode==='exam'&&answers.size<questions.length){find('exam-status').textContent=`Còn ${questions.length-answers.size} câu chưa trả lời. Hãy hoàn thành trước khi nộp.`;return}submitted=true;summary()}));
find('exam-nav').replaceChildren();questions.forEach((entry,i)=>{const b=action(String(i+1)+(answers.has(entry.id)?' ✓':''),()=>{index=i;render()});b.setAttribute('aria-label',`Câu ${i+1}${answers.has(entry.id)?', đã trả lời':''}`);b.setAttribute('aria-pressed',String(i===index));find('exam-nav').append(b)});
const nav=find('exam-nav'),active=nav.querySelector('[aria-pressed="true"]');
if(active)nav.scrollLeft+=active.getBoundingClientRect().left-nav.getBoundingClientRect().left-(nav.clientWidth-active.offsetWidth)/2;
}
function summary(){
 const stage=find('exam-stage');stage.replaceChildren(node('h2','Kết quả luyện tập'));
 const total=questions.filter(q=>answers.get(q.id)===q.answer).length;
 const unanswered=questions.filter(q=>!answers.has(q.id)).length;
 const incorrect=questions.length-total-unanswered;
 stage.append(node('h3',`Đúng ${total}/${questions.length} câu`),node('p',`✓ Đúng: ${total} · ✗ Sai: ${incorrect} · — Chưa trả lời: ${unanswered}`));
 for(const [type,label] of Object.entries(data.types)){
  const rows=questions.filter(q=>q.type===type);if(!rows.length)continue;
  const correct=rows.filter(q=>answers.get(q.id)===q.answer).length;
  stage.append(node('p',`${label}: ${correct}/${rows.length}`));
 }
 stage.append(node('p','Điểm luyện tập, không quy đổi thành điểm JLPT.'),node('h3','Kết quả từng câu'));
 questions.forEach((q,questionIndex)=>{
  const chosen=answers.get(q.id),correct=chosen===q.answer;
  const state=chosen===undefined?'unanswered':correct?'correct':'incorrect';
  const label=chosen===undefined?'— Chưa trả lời':correct?'✓ Đúng':'✗ Sai';
  const row=node('section','','review-row '+state);
  row.append(node('h3',`Câu ${questionIndex+1} · ${label}`,'result-label'),node('p',`${q.word} · ${q.source.reading} · ${q.source.meaning_vi}`));
  row.append(node('p',chosen===undefined?'Bạn chưa chọn đáp án.':`Bạn chọn: ${chosen+1}. ${q.options[chosen]}`));
  if(!correct)row.append(node('p',`Đáp án đúng: ${q.answer+1}. ${q.options[q.answer]}`));
  row.append(node('p',`${q.source_file}:${q.source_line}`,'source'),action('Xem lại câu này',()=>{index=questionIndex;render()}));
  stage.append(row);
 });
 find('exam-actions').replaceChildren(action('Xem đáp án từng câu',()=>{index=0;render()}));
 find('exam-status').textContent='Đã tổng kết bài. Lựa chọn được giữ nguyên trong phiên này.';
}
render();
})();
</script>
</div>

</html>

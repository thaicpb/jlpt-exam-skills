name: Deploy flashcard web app

on:
  push:
    branches: [main]
    paths:
      - "resources/**"
      - "webapp/**"
      - "tools/build_webapp.py"
      - "skills/jlpt-vocabulary-flashcards/scripts/load_vocabulary.py"
      - ".github/workflows/webapp.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build web app from resources
        run: python3 tools/build_webapp.py --output dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
